[project]
name = "knightswhosaydb"
version = "0.1.7.dev2"
description = "Multibeam backscatter reading and processing"
authors = [{name = "Benjamin Misiuk", email = "bmisiuk@mun.ca"},
           {name = "Peter Urban", email = "peter.urban@urcoustics.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">= 3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    # PyPI lags the conda channel: pip users get the latest published there,
    # while conda builds pin the dev release (recipe.yaml / [tool.pixi]).
    "themachinethatgoesping>=0.35.1,<0.36",
    "rasterio>=1.5.0,<2",
]

[project.urls]
Homepage = "https://github.com/benjaminmisiuk/knights-who-say-db"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/knightswhosaydb"]

